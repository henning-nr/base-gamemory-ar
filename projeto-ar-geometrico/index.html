<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Geometria com Hiro Marker</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Marcador Hiro -->
      <a-marker preset="hiro">
        
        <!-- Cubo -->
        <a-box 
          position="1 -1 -1" 
          rotation="0 45 0" 
          color="#4CC3D9"
          animation="property: rotation; to: 0 405 0; loop: true; dur: 3000">
        </a-box>
        
        <!-- Esfera -->
        <a-sphere 
          position="-1 0.5 0" 
          radius="0.5" 
          color="#EF2D5E">
        </a-sphere>
        
        <!-- Cilindro -->
        <a-cylinder 
          position="1 0.5 0"
          rotation="0 45 45" 
          radius="0.3" 
          height="1" 
          color="#FFC65D"
          animation="property: position; to: 1 1 0; dir: alternate; loop: true; dur: 1000">
        </a-cylinder>
        
        <!-- Torus (anel) -->
        <a-torus 
          position="0 1.5 0" 
          color="#7BC8A4" 
          radius="0.5" 
          radius-tubular="0.1"
          animation="property: rotation; to: 360 0 0; loop: true; dur: 2000">
        </a-torus>

      </a-marker>

      <!-- Câmera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
